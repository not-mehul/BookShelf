[versions]
agp = "9.5.0"
androidx-activity = "1.13.0"
androidx-core = "1.19.1"
androidx-documentfile = "1.1.0"
androidx-fragment = "1.9.1"
androidx-glance = "1.2.0"
androidx-lifecycle = "2.11.0"
androidx-webkit = "1.18.0"
junit = "4.13.2"
kotlin = "2.4.21"
org-json = "20260814"
kotlinx-coroutines = "1.11.0"
play-services-code-scanner = "16.1.0"

[libraries]
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidx-activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "androidx-documentfile" }
# Pinned: Play services pulls Fragment 1.0.0, which breaks Activity Result request codes.
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "androidx-fragment" }
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "androidx-glance" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "androidx-lifecycle" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidx-webkit" }
play-services-code-scanner = { module = "com.google.android.gms:play-services-code-scanner", version.ref = "play-services-code-scanner" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
# Real org.json for JVM unit tests (android.jar only ships stubs).
org-json = { module = "org.json:json", version.ref = "org-json" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
# Build classpath only: overrides the older KGP that AGP's built-in Kotlin defaults to.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Compose compiler for the Jetpack Glance home-screen widget.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
