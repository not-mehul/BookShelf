<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0d0b" />
    <meta name="description" content="Personal catalog for books, movies, TV, and quotes." />
    <title>BookShelf</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <script>
      // Set the theme before the first paint, so there is no flash (style.md §14).
      try {
        var mode = localStorage.getItem('bookshelf:theme');
        var dark =
          mode === 'dark' || (mode !== 'light' && !matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/src/styles/app.css" />
  </head>
  <body>
    <div class="glow-layer" aria-hidden="true">
      <div class="glow glow-1"></div>
      <div class="glow glow-2"></div>
      <div class="glow glow-3"></div>
    </div>

    <main id="app" class="app-shell"></main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
